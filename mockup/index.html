function heading(title,subtitle,extra=''){return `<div class="heading"><div><div class="eyebrow">YOUR IELTS JOURNEY</div><h1>${title}</h1><p class="sub">${subtitle}</p></div>${extra}</div>`}
function footer(){return '<footer><span>SoloLanguages · Từng bước đến IELTS 7.0+</span><span>Mockup tương tác · Dữ liệu demo lưu trên trình duyệt</span></footer>'}
function renderNav(){document.getElementById('navigation').innerHTML=Object.entries(pages).map(([id,name],i)=>`${i===6?'<div class="nav-label">ĐÁNH GIÁ & TIẾN ĐỘ</div>':''}<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="ico" aria-hidden="true">${icons[id]}</span>${name}${id==='review'?`<span class="count">${state.words.length}</span>`:''}</button>`).join('')}
function treeMarkup(wide=false){const start=treeTab==='Writing'?'Chủ ngữ & động từ':treeTab==='Reading'?'Nhận diện từ':treeTab==='Speaking'?'Lời chào cơ bản':treeTab==='Grammar'?'Bảng chữ cái':'Nhận diện âm';return `<div class="tree ${wide?'wide-tree':''}"><button class="node current ${state.done.includes(0)?'mastered':''}" data-lesson="0">${state.done.includes(0)?'✓':'◉'} ${wide?start:'Bảng chữ cái'}</button><div class="stem"></div><div class="branches"></div><div class="node-row"><button class="node" data-locked>♙ Âm cơ bản</button><button class="node" data-locked>♙ Từ đầu tiên</button></div><div class="node-row"><div class="stem"></div><div class="stem"></div></div><div class="node-row"><button class="node" data-locked>♙ Câu đơn</button><button class="node" data-locked>♙ Giao tiếp</button></div></div><div class="mastery-note">✧ &nbsp; Đạt mastery để mở kỹ năng tiếp theo<br>Chính xác ≥ 85% · Vượt 2 checkpoint · Vận dụng thực tế</div>`}
function dashboard(){return heading('Chào Minh, bắt đầu hành trình nhé!','Không cần nền tảng. Mỗi ngày tiến bộ một chút.','<span class="pill">☀ &nbsp; Hôm nay là một khởi đầu tốt</span>')+`<div class="layout"><div class="stack"><section class="hero"><div><div class="eyebrow">PHASE 0 · ABSOLUTE BEGINNER</div><h2>Bước đầu tiên,<br>nền tảng vững chắc.</h2><p>Một lộ trình dành riêng cho bạn.<br>Bắt đầu từ những điều cơ bản nhất.</p><button class="primary" data-lesson="${quests.findIndex((q,i)=>!state.done.includes(i))<0?0:quests.findIndex((q,i)=>!state.done.includes(i))}">${state.done.length?'Tiếp tục ngày 1':'Bắt đầu ngày 1'} <span>→</span></button><span class="hero-time">◷ &nbsp; 30 phút · 6 hoạt động</span></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 230 200"><circle cx="143" cy="99" r="84" fill="#e8e0fb" opacity=".6"/><ellipse cx="137" cy="176" rx="81" ry="11" fill="#ded4f3" opacity=".5"/><path d="M45 155 Q135 160 101 111 Q60 65 157 62" stroke="#c8b8eb" fill="none" stroke-width="2" stroke-dasharray="5 5"/><path d="M48 142h48v25H48z" fill="#bdabe9"/><path d="M95 113h48v54H95z" fill="#a28bdc"/><path d="M142 81h48v86h-48z" fill="#8770cc"/><path d="M160 81V24" stroke="#675196" stroke-width="3"/><path d="M161 25h38l-9 12 9 12h-38z" fill="#6953b4"/><text x="167" y="41" fill="#fff" font-size="10" font-family="Arial">7.0+</text><circle cx="58" cy="133" r="16" fill="white" stroke="#b4a0de"/><text x="54" y="138" fill="#8c73c6" font-size="14" font-family="Arial">0</text><path d="m205 91 3-7 3 7 7 3-7 3-3 7-3-7-7-3z" fill="#bca6e4"/><circle cx="72" cy="40" r="4" fill="#d5c4ed"/><path d="m119 26 2-5 2 5 5 2-5 2-2 5-2-5-5-2z" fill="#c0acde"/></svg></div></section><div class="stats"><div class="stat"><div class="stat-top">LEVEL HIỆN TẠI <span class="stat-icon">♧</span></div><div class="stat-value">0 <small>/ 100</small></div><div class="stat-foot">Absolute Beginner</div></div><div class="stat"><div class="stat-top">TỔNG KINH NGHIỆM <span class="stat-icon">ϟ</span></div><div class="stat-value">${xp()} <small>/ 100 XP</small></div><div class="bar"><i style="width:${xp()}%"></i></div><div class="stat-foot">${100-xp()} XP nữa đến mốc XP Level 1</div></div><div class="stat"><div class="stat-top">CHUỖI NGÀY HỌC <span class="stat-icon" style="background:#fff3e8;color:#e5ab71">♨</span></div><div class="stat-value">${state.done.length?'1':'0'} <small>ngày</small></div><div class="stat-foot">${state.done.length?'Một khởi đầu thật tốt!':'Bắt đầu chuỗi hôm nay'}</div></div></div><div class="two-col"><section class="card"><div class="card-head"><h2>Nhiệm vụ hôm nay</h2><span class="tag">DAY 1</span></div><p class="sub">${state.done.length}/6 hoàn thành · Chậm mà chắc, bạn nhé.</p><div class="quests">${quests.map((q,i)=>`<button class="quest ${state.done.includes(i)?'done':''}" data-lesson="${i}"><span class="check">${state.done.includes(i)?'✓':''}</span><span class="qicon">${q[4]}</span><span><span class="q-title">${q[0]}</span><span class="q-meta" style="display:block">${q[1]} · ${q[2]}</span></span><span class="xp">+${q[3]} XP</span></button>`).join('')}</div></section><section class="card"><div class="card-head"><h2>Cây kỹ năng</h2><button class="link" data-page="tree">Xem tất cả ↗</button></div><p class="sub">Nền tảng trước, IELTS sau.</p>${treeMarkup()}</section></div><section class="card week-strip"><div><strong>✧ &nbsp; Xây thói quen, từng ngày một</strong><p>Hoàn thành bài học đầu tiên để bắt đầu chuỗi của bạn.</p></div><div class="week-days">${['N1','N2','N3','N4','N5','N6','N7'].map((d,i)=>`<span>${i===0&&state.done.length?'✓':d}</span>`).join('')}</div></section></div><aside class="stack right-rail"><section class="card target"><div class="target-top"><h2>Đích đến của bạn</h2><span style="color:#c3b7d9">⚑</span></div><div class="target-band"><strong>7.0+</strong><span>IELTS Overall</span></div><div class="target-caption">Mọi hành trình đều bắt đầu từ số 0.</div><div class="small-row"><span>Level 0</span><span>C1 / IELTS 7.0+</span></div><div class="bar"><i style="width:0%"></i></div><div class="small-row"><span>Band hiện tại</span><span>Chưa đánh giá</span></div><div class="divider"></div><div class="eyebrow" style="font-size:9px">4 KỸ NĂNG CỦA BẠN</div>${['Listening','Reading','Writing','Speaking'].map(s=>`<div class="skill"><div class="small-row"><span>${s}</span><span>Chưa đánh giá</span></div><div class="bar"></div></div>`).join('')}</section><section class="card"><div class="card-head"><h2>Ôn tập thông minh</h2><span style="color:#b1a3c7">↻</span></div><div class="review-empty"><div class="round-icon">▣</div><strong>${state.words.length?`${state.words.length} từ sẵn sàng ôn tập`:'Chưa có thẻ cần ôn'}</strong><p>${state.words.length?'Luyện nhớ những từ đầu tiên của bạn.':'Thẻ ôn tập sẽ xuất hiện<br>sau bài học đầu tiên.'}</p>${state.words.length?'<button class="link" data-page="review">Ôn tập ngay →</button>':''}</div><div class="days">${['D0','D1','D3','D7','D14','D30'].map(d=>`<span>${d}</span>`).join('')}</div></section><section class="quote"><strong>“Một bước nhỏ mỗi ngày.”</strong><p>Học hiểu → Luyện tập → Kiểm tra → Ôn tập.<br>Vững kiến thức rồi mới đi tiếp.</p></section></aside></div>`}
const phaseNames=['Absolute Beginner','English Foundation','Elementary English','Pre-Intermediate','Intermediate','Upper-Intermediate','IELTS Foundation','IELTS 6.0','IELTS 6.5','IELTS 7.0','IELTS 7.5+'];
function roadmap(){return heading('Một lộ trình. Từng bước vững chắc.','Level 0 → A1 → A2 → B1 → B2 → C1. Không nhảy cóc kiến thức.')+'<div class="notice">✧ XP ghi nhận nỗ lực. Kỹ năng chỉ mở khi vượt mastery: chính xác ≥ 85%, vượt 2 checkpoint liên tiếp, sửa lỗi thường gặp và vận dụng được trong ngữ cảnh.</div><div class="roadmap">'+phaseNames.map((n,i)=>`<section class="card phase ${i?'locked':''}"><div class="card-head"><span class="phase-number">PHASE ${String(i).padStart(2,'0')}</span><span class="tag">${i?'♙ Chưa mở':'◉ Đang học'}</span></div><h3>${n}</h3><p>${i===0?'Bảng chữ cái, âm cơ bản, từ đầu tiên và câu giới thiệu.':i<4?'Xây vốn từ, ngữ pháp và giao tiếp theo trình độ.':i<7?'Phát triển bốn kỹ năng, đọc hiểu và diễn đạt ý.':'Luyện dạng bài IELTS và đánh giá theo tiêu chí.'}</p><button class="${i?'link':'primary'}" ${i?'data-phase="'+i+'"':'data-lesson="0"'}>${i?'Xem điều kiện mở khóa →':'Bắt đầu Phase 0 →'}</button></section>`).join('')+'</div>'}
function treePage(){return heading('Vững từng nhánh, mở cả hành trình.','Mỗi kỹ năng đều có kiến thức tiên quyết và checkpoint riêng.')+`<div class="tabs">${['Listening','Reading','Writing','Speaking','Grammar'].map(s=>`<button data-tree="${s}" class="${s===treeTab?'active':''}">${s}</button>`).join('')}</div><section class="card"><div class="card-head"><h2>${treeTab} · Foundation</h2><span class="tag">LEVEL 0</span></div>${treeMarkup(true)}<p class="sub" style="text-align:center;margin-top:20px">Hoàn thành bài học mẫu chỉ ghi nhận luyện tập; chưa chứng nhận mastery.</p></section>`}
function vocabulary(){let w=words[wordIndex];return heading('Học từ trong ngữ cảnh.','Hiểu nghĩa, cách dùng và ghi nhớ qua từng lần ôn tập.')+`<div class="tabs"><span class="pill">General English · Level 0</span><span class="pill">${wordIndex+1} / ${words.length} từ</span></div><div class="word-grid"><section class="card"><div class="eyebrow">TỪ ĐẦU TIÊN CỦA BẠN</div><div class="word">${w.word}</div><p>${w.ipa} &nbsp; · &nbsp; ${w.meaning}</p><div class="example"><b>${w.example}</b><br><span style="font-size:12px;color:#988ca8">${w.translation}</span></div>${state.words.includes(wordIndex)?`<span class="status">✓ Đang ôn</span> <button class="secondary" data-rq-remove="${wordIndex}">Tạm bỏ ôn</button>`:`<button class="primary" data-addword="${wordIndex}">${state.pausedWords?.includes(wordIndex)?'↻ Thêm lại vào ôn tập':'＋ Thêm vào ôn tập'}</button>`}<p class="sub" style="margin-top:12px">Tạm bỏ ôn chỉ dừng đưa từ vào quiz. Bạn vẫn có thể xem và thêm lại từ ở đây.</p><div class="modal-actions"><button class="secondary" id="prev-word">← Từ trước</button><button class="secondary" id="next-word">Từ tiếp →</button></div></section><section class="card"><h3 style="font-size:14px">Hiểu sâu hơn một định nghĩa</h3><p><b>Cụm từ thường dùng</b><br>${w.collocation}</p><p><b>Gần nghĩa / trái nghĩa</b><br>${w.synonym}<br>${w.antonym}</p><p><b>Lỗi thường gặp</b><br>${w.mistake}</p><p><b>Ứng dụng trong IELTS</b><br>${w.usage}</p></section></div>`}
function review(){return heading('Nhớ lâu hơn, học nhẹ hơn.','Lịch ôn: ngày 0 → 1 → 3 → 7 → 14 → 30.')+`<section class="card"><div class="card-head"><h2>Hàng đợi ôn tập</h2><span class="tag">${state.words.length} THẺ</span></div>${state.words.length?`<div class="table-wrap"><table><thead><tr><th>TỪ VỰNG</th><th>NGHĨA</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>${state.words.map(i=>`<tr><td><b>${words[i].word}</b> <span style="color:#b2a7bf">${words[i].ipa}</span></td><td>${words[i].meaning}</td><td><span class="tag">Day 0 · Mới học</span></td><td><button class="link" data-flash="${i}">Luyện nhớ →</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="round-icon">↻</div><h3>Một hàng đợi trống, một khởi đầu mới.</h3>Thêm từ vựng từ bài học đầu tiên để bắt đầu ôn tập.<br><br><button class="primary" data-page="vocabulary">Khám phá từ đầu tiên →</button></div>'}</section><p class="sub" style="margin-top:18px">Bản mockup minh họa flashcard; lịch lặp tự động sẽ được triển khai ở phiên bản sản phẩm.</p>`}
function errors(){return heading('Mỗi lỗi sai là một lần tiến bộ.','Hiểu vì sao sai, sửa đúng và luyện lại trong ngữ cảnh.')+`<section class="card"><div class="card-head"><h2>Sổ lỗi của tôi</h2><span class="tag">${state.errors.length} LỖI CẦN ÔN</span></div>${state.errors.length?`<div class="table-wrap"><table><thead><tr><th>BÀI HỌC</th><th>VÌ SAO SAI / QUY TẮC</th><th>ĐÁP ÁN ĐÚNG</th><th></th></tr></thead><tbody>${state.errors.map(i=>`<tr><td>${quests[i][0]}</td><td>${lessons[i].rule}</td><td>${lessons[i].options[lessons[i].correct]}</td><td><button class="link" data-lesson="${i}">Luyện lại →</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="round-icon">✓</div><h3>Chưa có lỗi nào được ghi nhận.</h3>Lỗi từ câu hỏi mẫu sẽ được lưu tại đây để bạn luyện lại.<br><br><button class="primary" data-lesson="0">Bắt đầu bài học đầu tiên →</button></div>'}</section>`}
function tests(){return heading('Kiểm tra để hiểu mình hơn.','Đánh giá đúng thời điểm, đúng với nền tảng hiện tại.')+`<div class="roadmap">${[['Checkpoint nền tảng','LEVEL 0','Nhận diện chữ cái và những từ đầu tiên.','Làm thử câu hỏi mẫu',false],['Weekly Assessment','DAY 7','Đánh giá 6 nhóm kỹ năng sau một tuần học.','Mở sau 7 ngày',true],['IELTS Mock Test','IELTS FOUNDATION','Bài thi đủ 4 kỹ năng, sau khi đạt nền tảng cần thiết.','Yêu cầu đủ nền tảng',true]].map(([a,b,c,d,locked])=>`<section class="card phase"><span class="tag">${b}</span><h3>${a}</h3><p>${c}</p><button ${locked?'data-locked class="secondary"':'data-lesson="0" class="primary"'}>${locked?'♙ ':''}${d}</button></section>`).join('')}</div><div class="notice" style="margin-top:24px">Chưa có kết quả đánh giá, nên chưa có band ước tính. Bài thi IELTS đầy đủ chỉ mở khi nền tảng phù hợp; người học Level 0 bắt đầu bằng đánh giá cơ bản.</div>`}
function progress(){return heading('Tiến bộ đến từ sự đều đặn.','Nhìn lại những bước nhỏ bạn đã thực hiện.')+`<div class="stats"><section class="stat"><div class="eyebrow">XP TÍCH LŨY</div><div class="stat-value">${xp()} <small>XP</small></div></section><section class="stat"><div class="eyebrow">HOẠT ĐỘNG ĐÃ HỌC</div><div class="stat-value">${state.done.length}<small> / 6</small></div></section><section class="stat"><div class="eyebrow">TỪ VỰNG ĐÃ LƯU</div><div class="stat-value">${state.words.length}</div></section></div><section class="card" style="margin-top:22px"><div class="card-head"><h2>Ngày 1 · Level 0</h2><span class="tag">${Math.round(state.done.length/6*100)}% HOÀN THÀNH</span></div><div class="bar" style="height:10px;margin-top:22px"><i style="width:${state.done.length/6*100}%"></i></div><div class="empty"><h3>Chưa đủ dữ liệu để đánh giá band.</h3>Hoàn thành các bài học và checkpoint để có hồ sơ năng lực.<br>XP không được quy đổi trực tiếp thành band IELTS.</div></section>`}
function settings(){return heading('Không gian học theo cách của bạn.','Điều chỉnh mục tiêu nhỏ để giữ một hành trình dài.')+`<section class="card" style="max-width:750px"><div class="setting-row"><div><b>Mục tiêu học mỗi ngày</b><p>Thiết lập cho bản demo trên trình duyệt này.</p></div><select id="minutes" aria-label="Số phút học mỗi ngày">${[15,30,45,60].map(v=>`<option ${state.dailyMinutes===v?'selected':''} value="${v}">${v} phút</option>`).join('')}</select></div><div class="setting-row"><div><b>Mục tiêu IELTS</b><p>Overall 7.0+ · Listening / Reading 7.0+ · Writing / Speaking 6.5–7.0+</p></div><span class="tag">7.0+</span></div><div class="setting-row"><div><b>Dữ liệu demo</b><p>Đặt lại bài đã học, XP, từ vựng và sổ lỗi của bản mockup.</p></div><button class="secondary" id="reset">Đặt lại demo</button></div></section>`}
function render(){renderNav();document.getElementById('breadcrumb').textContent=pages[page];document.getElementById('app').innerHTML=({dashboard,roadmap,tree:treePage,vocabulary,review,errors,tests,progress,settings}[page])()+footer()}
const lessons=[{explanation:'Tiếng Anh có 26 chữ cái. Hôm nay, mình bắt đầu với A, B và C. Chữ “A” có tên đọc là /eɪ/.',example:'A a · B b · C c',question:'Chữ in thường nào tương ứng với chữ A?',options:['b','a','c'],correct:1,rule:'A là chữ in hoa; a là chữ in thường của cùng một chữ cái.'},{explanation:'“Hello” nghĩa là “xin chào”. Dùng từ này khi bắt đầu cuộc trò chuyện. Hãy đọc chậm câu bên dưới.',example:'Hello! My name is Minh.',question:'“Hello” có nghĩa là gì?',options:['Tạm biệt','Cảm ơn','Xin chào'],correct:2,rule:'Hello là lời chào khi gặp mặt hoặc bắt đầu cuộc trò chuyện.'},{explanation:'Chạm “Nghe mẫu” để nghe chữ A bằng giọng tổng hợp của trình duyệt, rồi chọn chữ tương ứng. Nếu thiết bị không có giọng tiếng Anh, bạn vẫn có thể xem phiên âm /eɪ/.',example:'A · /eɪ/',question:'Tên chữ cái đọc /eɪ/ là chữ nào?',options:['A','B','C'],correct:0,rule:'Tên chữ cái A được phát âm /eɪ/.'},{explanation:'Để giới thiệu tên mình, bạn có thể nói: “My name is Minh.” Hãy thử nói câu này thành tiếng trước khi trả lời.',example:'My name is Minh.',question:'Chọn câu giới thiệu tên đúng.',options:['My name are Minh.','My name is Minh.','My Minh name.'],correct:1,rule:'Chủ ngữ “My name” là số ít, nên dùng “is”.'},{explanation:'“Book” nghĩa là quyển sách. Trong câu “This is a book”, từ “a” cho biết chúng ta nói đến một quyển sách.',example:'This is a book.',question:'“A book” có nghĩa là gì?',options:['Một quyển sách','Một cái bàn','Một cây bút'],correct:0,rule:'Book là danh từ chỉ quyển sách; a book nghĩa là một quyển sách.'},{explanation:'“I am…” có nghĩa là “Tôi là…”. Đặt “a” trước student khi giới thiệu mình là một học sinh hoặc sinh viên.',example:'I am a student.',question:'Chọn từ còn thiếu: I ___ a student.',options:['is','are','am'],correct:2,rule:'Chủ ngữ I đi với am: I am a student.'}];
function openModal(html){returnFocus=document.activeElement;document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';document.querySelector('#modal-body button')?.focus()}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()}
function lesson(i){lessonIndex=i;step=0;answered=false;drawLesson()}
function drawLesson(){const l=lessons[lessonIndex];openModal(`<div class="modal-head"><span class="tag">DAY 1 · ${quests[lessonIndex][1].toUpperCase()} · BÀI MẪU</span><button class="close" data-close aria-label="Đóng">×</button></div><h2 id="modal-title">${quests[lessonIndex][0]}</h2><div class="tabs" style="margin:15px 0"><span class="tag">${step===0?'01 · Học hiểu':'✓ Học hiểu'}</span><span class="tag">02 · Thử sức</span></div>${step===0?`<p>${l.explanation}</p><div class="lesson-example" style="${lessonIndex>0?'font-size:22px;letter-spacing:0':''}">${l.example}</div>${lessonIndex===2?'<button class="secondary" id="speak">♫ Nghe mẫu</button>':''}<div class="notice">Đây là bài học rút gọn để thử giao diện. Bản đầy đủ có luyện có hướng dẫn, luyện độc lập, mini test và checkpoint.</div><div class="modal-actions"><span class="sub" style="font-size:11px;color:#a498b4">Beginner · ★☆☆☆☆</span><button class="primary" id="to-question">Thử câu hỏi mẫu →</button></div>`:`<p><b>${l.question}</b></p>${l.options.map((o,i)=>`<button class="answer" data-answer="${i}">${o}</button>`).join('')}<div class="feedback" id="feedback" role="status"></div><div class="modal-actions"><button class="link" id="back-lesson">← Xem lại kiến thức</button><button class="primary" id="finish" disabled>Hoàn thành · +${quests[lessonIndex][3]} XP</button></div>`}`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;document.getElementById('sidebar').classList.remove('visible');render();window.scrollTo(0,0)}else if(b.dataset.lesson!==undefined)lesson(Number(b.dataset.lesson));else if(b.hasAttribute('data-locked'))toast('Cần đạt mastery ở kỹ năng tiên quyết trước khi mở bài này.');else if(b.dataset.tree){treeTab=b.dataset.tree;render()}else if(b.dataset.phase){const i=Number(b.dataset.phase);openModal(`<div class="modal-head"><span class="tag">PHASE ${i}</span><button class="close" data-close aria-label="Đóng">×</button></div><h2 id="modal-title">${phaseNames[i]}</h2><p>Hoàn thành phase trước và vượt bài đánh giá nền tảng để mở phase này.</p><div class="notice">Mastery yêu cầu: chính xác ≥ 85%, vượt 2 lần liên tiếp, không lặp lỗi thường gặp và vận dụng được trong ngữ cảnh. XP đơn thuần không mở khóa phase.</div><button class="primary" data-close>Đã hiểu</button>`)}else if(b.hasAttribute('data-close'))closeModal();else if(b.id==='to-question'){step=1;drawLesson()}else if(b.id==='back-lesson'){step=0;answered=false;drawLesson()}else if(b.dataset.answer!==undefined){if(answered)return;let selected=Number(b.dataset.answer),l=lessons[lessonIndex],correct=selected===l.correct;b.classList.add(correct?'correct':'wrong');document.getElementById('feedback').textContent=correct?'Chính xác! '+l.rule:'Chưa đúng. '+l.rule+' Hãy thử lại.';if(correct){answered=true;document.getElementById('finish').disabled=false}else{if(!state.errors.includes(lessonIndex)){state.errors.push(lessonIndex);save()}}}else if(b.id==='finish'){if(!state.done.includes(lessonIndex)){state.done.push(lessonIndex);if(lessonIndex===1&&!state.words.includes(0)&&!state.pausedWords?.includes(0))state.words.push(0);save();toast(`Đã hoàn thành bài mẫu · +${quests[lessonIndex][3]} XP`)}else toast('Bạn đã nhận XP cho bài này. Ôn lại không cộng XP lần nữa.');closeModal();render()}else if(b.dataset.addword!==undefined){let i=Number(b.dataset.addword);if(!state.words.includes(i)){state.words.push(i);save();render();toast('Đã thêm từ vào hàng đợi ôn tập.')}else toast('Từ này đã có trong hàng đợi ôn tập.')}else if(b.id==='next-word'||b.id==='prev-word'){wordIndex=(wordIndex+(b.id==='next-word'?1:words.length-1))%words.length;render()}else if(b.dataset.flash!==undefined){let i=Number(b.dataset.flash);openModal(`<div class="modal-head"><span class="tag">FLASHCARD · DAY 0</span><button class="close" data-close aria-label="Đóng">×</button></div><h2 id="modal-title">${words[i].word}</h2><p>${words[i].ipa}</p><div id="flash-answer"><p>Thử nhớ nghĩa của từ này trước khi xem đáp án.</p><button class="primary" data-reveal="${i}">Hiện đáp án</button></div>`)}else if(b.dataset.reveal!==undefined){const w=words[Number(b.dataset.reveal)];document.getElementById('flash-answer').innerHTML=`<div class="example"><b>${w.meaning}</b><br>${w.example}</div><p class="sub">Lượt luyện thử · chưa thay đổi lịch ôn tự động.</p><button class="primary" data-close>Xong lượt luyện</button>`}else if(b.id==='speak'){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('A');u.lang='en-GB';u.rate=.7;speechSynthesis.speak(u)}else toast('Trình duyệt chưa hỗ trợ đọc mẫu. Phiên âm của A là /eɪ/.')}else if(b.id==='menu')document.getElementById('sidebar').classList.toggle('visible');else if(b.id==='notifications')toast('Chưa có thông báo mới. Bài học đầu tiên đang chờ bạn!');else if(b.id==='reset')openModal('<div class="modal-head"><span class="tag">DỮ LIỆU DEMO</span><button class="close" data-close aria-label="Đóng">×</button></div><h2 id="modal-title">Bắt đầu lại bản demo?</h2><p>XP, bài đã học, từ vựng và sổ lỗi trên trình duyệt này sẽ được đặt lại.</p><div class="modal-actions"><button class="secondary" data-close>Giữ tiến độ</button><button class="primary" id="confirm-reset">Đặt lại demo</button></div>');else if(b.id==='confirm-reset'){state={done:[],words:[],errors:[],dailyMinutes:30};save();closeModal();render();toast('Đã đặt lại bản demo.') }});
document.addEventListener('change',e=>{if(e.target.id==='minutes'){state.dailyMinutes=Number(e.target.value);save();toast('Đã lưu mục tiêu học mỗi ngày.')}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(!m.classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...m.querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')];let first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});render();
</script>
<script src="onboarding.js"></script>
<script src="review-quiz.js"></script>
</body></html>
